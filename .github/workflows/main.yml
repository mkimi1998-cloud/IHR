name: Build iHR APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          set -e
          mkdir -p app/src
          cd app
          cat > 'package.json' <<'IHR_EOF'
          {
            "name": "ihr",
            "version": "1.0.3",
            "main": "node_modules/expo/AppEntry.js",
            "scripts": { "start": "expo start", "android": "expo run:android" },
            "dependencies": {
              "expo": "~51.0.28",
              "expo-application": "~5.9.1",
              "expo-camera": "~15.0.16",
              "expo-location": "~17.0.1",
              "expo-secure-store": "~13.0.2",
              "expo-status-bar": "~1.12.1",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": { "@babel/core": "^7.24.0" },
            "private": true
          }
          IHR_EOF
          cat > 'babel.config.js' <<'IHR_EOF'
          module.exports = function (api) { api.cache(true); return { presets: ['babel-preset-expo'] }; };
          IHR_EOF
          cat > 'app.json' <<'IHR_EOF'
          {
            "expo": {
              "name": "iHR 2",
              "slug": "iHr2",
              "version": "1.0.3",
              "orientation": "portrait",
              "userInterfaceStyle": "light",
              "android": {
                "package": "my.gov.mtib.ihr.v2",
                "versionCode": 4,
                "permissions": [
                  "android.permission.CAMERA",
                  "android.permission.ACCESS_COARSE_LOCATION",
                  "android.permission.ACCESS_FINE_LOCATION"
                ]
              },
              "plugins": [
                [
                  "expo-camera",
                  {
                    "cameraPermission": "Allow iHR to access the camera for QR scanning and attendance photos."
                  }
                ],
                [
                  "expo-location",
                  {
                    "locationWhenInUsePermission": "Allow iHR to use your location for geotagging attendance."
                  }
                ],
                "expo-secure-store"
              ],
              "scheme": "ihr2"
            }
          }
          IHR_EOF
          cat > 'App.js' <<'IHR_EOF'
          import React, { useCallback, useEffect, useRef, useState } from 'react';
          import { ActivityIndicator, Image, Platform, Pressable, SafeAreaView, ScrollView, StatusBar as RNBar, StyleSheet, Text, TextInput, View } from 'react-native';
          import { StatusBar } from 'expo-status-bar';
          import * as Location from 'expo-location';
          import { CameraView, useCameraPermissions } from 'expo-camera';
          import { C } from './src/theme';
          import { EP, call, clearSession, deviceId, loadSession, rows, saveDeviceId, saveSession, unwrap } from './src/api';

          const Btn = ({ label, onPress, kind = 'main', busy, disabled }) => (
            <Pressable onPress={onPress} disabled={busy || disabled} style={({ pressed }) => [s.btn, kind === 'ghost' && s.btnGhost, (busy || disabled) && { opacity: 0.5 }, pressed && { opacity: 0.8 }]}>
              {busy ? <ActivityIndicator color={kind === 'ghost' ? C.forest : '#fff'} /> : <Text style={[s.btnTx, kind === 'ghost' && { color: C.forest }]}>{label}</Text>}
            </Pressable>
          );
          const Card = ({ title, children }) => (<View style={s.card}>{title ? <Text style={s.cardT}>{title}</Text> : null}{children}</View>);
          const Err = ({ msg }) => (msg ? <View style={s.err}><Text style={{ color: C.bad }}>{msg}</Text></View> : null);
          const Top = ({ title, onBack }) => (
            <View style={s.top}>{onBack ? <Pressable onPress={onBack} hitSlop={12}><Text style={s.back}>‹ Kembali</Text></Pressable> : null}<Text style={s.topT}>{title}</Text></View>
          );

          function Register({ onDone }) {
            const [name, setName] = useState(''); const [no, setNo] = useState('');
            const [busy, setBusy] = useState(false); const [err, setErr] = useState(''); const [dev, setDev] = useState(String(deviceId()));
            const cont = async () => {
              if (!no.trim()) return setErr('Sila masukkan nombor staff');
              await saveDeviceId(dev); const sess = { staff_no: no.trim(), staff_id: '', name: name.trim() }; await saveSession(sess); onDone(sess);
            };
            const submit = async () => {
              if (!name.trim() || !no.trim()) return setErr('Sila masukkan nama dan nombor staff');
              setBusy(true); setErr('');
              try {
                await saveDeviceId(dev);
                const r = unwrap(await call(EP.register, { name: name.trim(), staff_no: no.trim(), imei: deviceId() }));
                const sess = { staff_no: no.trim(), staff_id: r?.staff_id ?? r?.id ?? '', name: r?.name ?? name.trim() };
                await saveSession(sess); onDone(sess);
              } catch (e) { setErr(e.message); } finally { setBusy(false); }
            };
            return (
              <ScrollView contentContainerStyle={{ flexGrow: 1 }} keyboardShouldPersistTaps="handled">
                <View style={s.hero}><Text style={s.logo}>iHR</Text><Text style={s.heroSub}>Lembaga Perindustrian Kayu Malaysia</Text></View>
                <View style={{ padding: 16 }}>
                  <Card title="Daftar Pengguna Baru">
                    <Text style={s.lbl}>Nama penuh</Text>
                    <TextInput style={s.in} value={name} onChangeText={setName} placeholder="Seperti dalam kad pengenalan" />
                    <Text style={s.lbl}>Nombor staff</Text>
                    <TextInput style={s.in} value={no} onChangeText={setNo} autoCapitalize="characters" placeholder="Contoh: 01234" />
                    <Err msg={err} />
                    <Btn kind="ghost" label="Sudah berdaftar - teruskan" onPress={cont} />
                    <Btn label="Daftar" onPress={submit} busy={busy} />
                  </Card>
                  <Text style={s.hint}>Peranti ini akan didaftarkan bersama nombor staff anda.</Text>
                  <View style={{ marginTop: 14 }}><Card title="ID peranti (lanjutan)">
                    <Text style={s.lbl}>Tukar hanya jika perlu guna ID yang sudah didaftarkan untuk telefon ini.</Text>
                    <TextInput style={s.in} value={dev} onChangeText={setDev} autoCapitalize="none" autoCorrect={false} />
                  </Card></View>
                </View>
              </ScrollView>
            );
          }

          const colorOf = (c) => { const v = String(c ?? '').trim(); return /^[0-9a-f]{6}$/i.test(v) ? '#' + v : v || C.mute; };

          function Dashboard({ sess, go, logout, onSess }) {
            const [data, setData] = useState(null); const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
            const [online, setOnline] = useState(null); const [at, setAt] = useState('');
            const load = useCallback(async () => {
              setBusy(true); setErr('');
              try {
                const r = await call(EP.dashboard, { staff_no: sess.staff_no, staff_id: sess.staff_id });
                setData(r); setOnline(true); setAt(new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }));
                const sd = r?.staff_data;
                if (sd?.staff_id && String(sd.staff_id) !== String(sess.staff_id)) { const ns = { staff_no: String(sd.staff_no ?? sess.staff_no), staff_id: String(sd.staff_id), name: sd.name || sess.name }; saveSession(ns); onSess && onSess(ns); }
              } catch (e) {
                setOnline(false);
                setErr(e.message.includes('HTTP 500') ? e.message + '\n\nPeranti ini belum dikaitkan dengan akaun di pelayan. ID peranti: ' + deviceId() : e.message);
              } finally { setBusy(false); }
            }, [sess]);
            useEffect(() => { load(); }, [load]);
            const sd = data?.staff_data || {};
            const name = sd.name || sess.name || 'Pengguna';
            const mia = data?.is_mia;
            const miaTxt = !mia ? 'Tiada' : typeof mia === 'object' ? rows(mia).map(([k, v]) => `${k}: ${v}`).join(', ') || 'Ada' : String(mia);
            const acts = [['Lapor Diri', 'mia'], ['Imbas QR', 'qr'], ['Geotagging', 'geo']];
            return (
              <ScrollView>
                <View style={s.hero}>
                  <View style={s.avatar}><Text style={s.avatarT}>{name.trim()[0]?.toUpperCase() || 'I'}</Text></View>
                  <Text style={s.heroHi}>Selamat datang,</Text>
                  <Text style={s.heroName}>{name}</Text>
                  <View style={s.chips}>
                    <View style={s.chip}><Text style={s.chipT}>No. staff {sd.staff_no ?? sess.staff_no}</Text></View>
                    <View style={s.chip}><View style={[s.dot, { backgroundColor: online == null ? C.mute : online ? '#6FD08F' : '#FF8A80' }]} /><Text style={s.chipT}>{online == null ? 'Menyemak…' : online ? `Dalam talian ${at}` : 'Luar talian'}</Text></View>
                  </View>
                </View>
                <View style={{ padding: 16, gap: 14 }}>
                  <View style={s.grid}>{acts.map(([l, k]) => (
                    <Pressable key={k} style={s.tile} onPress={() => go(k)}><View style={s.tileI}><Text style={s.tileIT}>{l[0]}</Text></View><Text style={s.tileT}>{l}</Text></Pressable>))}
                  </View>
                  {busy && !data ? <ActivityIndicator color={C.forest} /> : null}
                  <Err msg={err} />
                  {data ? (<>
                    <Card title="Kehadiran bulan ini">
                      <View style={s.swatchRow}><View style={[s.swatch, { backgroundColor: colorOf(data.att_color) }]} /><Text style={{ color: C.mute }}>Kod warna kad: {String(data.att_color ?? '-')}</Text></View>
                    </Card>
                    <Card title="Hari ini">
                      <Text style={{ color: C.ink }}>{data.msg?.clock_in || 'Belum ada rekod waktu masuk hari ini.'}</Text>
                      <View style={s.row}><Text style={s.rowK}>Status MIA</Text><Text style={s.rowV}>{miaTxt}</Text></View>
                    </Card>
                    <Card title="Profil">
                      <View style={s.rowCol}><Text style={s.rowK}>Nama</Text><Text style={s.rowVL}>{name}</Text></View>
                      <View style={s.row}><Text style={s.rowK}>No. staff</Text><Text style={s.rowV}>{String(sd.staff_no ?? sess.staff_no)}</Text></View>
                      {sd.staff_id ? <View style={s.row}><Text style={s.rowK}>ID staff</Text><Text style={s.rowV}>{String(sd.staff_id)}</Text></View> : null}
                    </Card>
                  </>) : null}
                  <Btn kind="ghost" label="Muat semula" onPress={load} busy={busy} />
                  <Card title="Peranti">
                    <View style={s.rowCol}><Text style={s.rowK}>ID peranti</Text><Text style={s.rowVL} selectable>{String(deviceId())}</Text></View>
                    <View style={s.row}><Text style={s.rowK}>Pelayan</Text><Text style={s.rowV}>ihr.mtib.gov.my</Text></View>
                  </Card>
                  <Btn kind="ghost" label="Log keluar" onPress={logout} />
                </View>
              </ScrollView>
            );
          }

          function useFix() {
            const [fix, setFix] = useState(null); const [err, setErr] = useState('');
            const get = useCallback(async () => {
              setErr('');
              const p = await Location.requestForegroundPermissionsAsync();
              if (p.status !== 'granted') return setErr('Tiada akses lokasi');
              try { const l = await Location.getCurrentPositionAsync({ accuracy: Location.Accuracy.High }); setFix(l.coords); }
              catch { setErr('Peranti tidak dapat mengesan lokasi anda'); }
            }, []);
            useEffect(() => { get(); }, [get]);
            return { fix, err, get };
          }
          const Loc = ({ fix, err, get }) => (
            <Card title="Lokasi semasa">
              {fix ? <><View style={s.row}><Text style={s.rowK}>Latitud</Text><Text style={s.rowV}>{fix.latitude.toFixed(6)}</Text></View>
                <View style={s.row}><Text style={s.rowK}>Longitud</Text><Text style={s.rowV}>{fix.longitude.toFixed(6)}</Text></View>
                <View style={s.row}><Text style={s.rowK}>Ketepatan</Text><Text style={s.rowV}>± {Math.round(fix.accuracy || 0)} m</Text></View></>
                : <Text style={{ color: C.mute }}>{err || 'Mengesan lokasi…'}</Text>}
              <Err msg={fix ? '' : err} /><Btn kind="ghost" label="Kesan semula" onPress={get} />
            </Card>
          );

          function Mia({ sess, back }) {
            const loc = useFix();
            const [busy, setBusy] = useState(false); const [err, setErr] = useState(''); const [ok, setOk] = useState('');
            const send = async () => {
              if (!sess.staff_id) return setErr('ID staff belum dimuatkan. Kembali ke Dashboard dan tunggu data dimuat.');
              if (!loc.fix) return setErr('Tiada akses lokasi');
              setBusy(true); setErr('');
              try {
                const r = await call(EP.mia, { staff_id: sess.staff_id, latitude: loc.fix.latitude, longitude: loc.fix.longitude });
                setOk(typeof r === 'string' ? r : 'Lapor diri berjaya dihantar.');
              } catch (e) { setErr(e.message); } finally { setBusy(false); }
            };
            return (<ScrollView><Top title="Lapor Diri" onBack={back} /><View style={{ padding: 16, gap: 14 }}>
              <Loc {...loc} />
              <Card title="Pengesahan"><Text style={{ color: C.ink }}>Lokasi semasa anda akan dihantar sebagai lapor diri.</Text></Card>
              <Err msg={err} />{ok ? <View style={s.okBox}><Text style={{ color: C.ok }}>{ok}</Text></View> : null}
              <Btn label="Hantar lapor diri" onPress={send} busy={busy} />
            </View></ScrollView>);
          }

          function Cam({ mode, sess, back }) {
            const [perm, ask] = useCameraPermissions(); const ref = useRef(null); const loc = useFix();
            const [shot, setShot] = useState(null); const [done, setDone] = useState(false);
            const [busy, setBusy] = useState(false); const [err, setErr] = useState(''); const [ok, setOk] = useState('');
            useEffect(() => { if (perm && !perm.granted) ask(); }, [perm]);
            const base = { staff_id: sess.staff_id };
            const need = () => (sess.staff_id ? '' : 'ID staff belum dimuatkan. Kembali ke Dashboard dan tunggu data dimuat.');
            const onQr = async ({ data }) => {
              if (done) return; if (need()) return setErr(need()); setDone(true); setBusy(true); setErr('');
              try { await call(EP.qr, { ...base, qr_code: data, latitude: loc.fix?.latitude, longitude: loc.fix?.longitude }); setOk('Imbasan QR berjaya.'); }
              catch (e) { setErr(e.message); setDone(false); } finally { setBusy(false); }
            };
            const snap = async () => { const p = await ref.current?.takePictureAsync({ quality: 0.4, base64: true }); if (p) setShot(p); };
            const sendPhoto = async () => {
              if (need()) return setErr(need()); if (!shot) return setErr('Sila muat naik gambar'); if (!loc.fix) return setErr('Tiada akses lokasi');
              setBusy(true); setErr('');
              try { await call(EP.geotag, { ...base, latitude: loc.fix.latitude, longitude: loc.fix.longitude, imej: shot.base64 }); setOk('Geotagging berjaya dihantar.'); }
              catch (e) { setErr(e.message); } finally { setBusy(false); }
            };
            if (!perm?.granted) return (<View style={{ flex: 1 }}><Top title="Kamera" onBack={back} /><View style={{ padding: 16 }}><Text>Tiada akses kamera.</Text><Btn label="Benarkan kamera" onPress={ask} /></View></View>);
            return (<ScrollView><Top title={mode === 'qr' ? 'Imbas QR' : 'Geotagging'} onBack={back} /><View style={{ padding: 16, gap: 14 }}>
              {shot ? <Image source={{ uri: shot.uri }} style={s.cam} /> :
                <CameraView ref={ref} style={s.cam} facing={mode === 'qr' ? 'back' : 'front'} barcodeScannerSettings={{ barcodeTypes: ['qr'] }} onBarcodeScanned={mode === 'qr' ? onQr : undefined} />}
              <Loc {...loc} /><Err msg={err} />{ok ? <View style={s.okBox}><Text style={{ color: C.ok }}>{ok}</Text></View> : null}
              {mode === 'photo' ? (shot ? <><Btn label="Hantar gambar" onPress={sendPhoto} busy={busy} /><Btn kind="ghost" label="Ambil semula" onPress={() => { setShot(null); setOk(''); }} /></> : <Btn label="Ambil Gambar" onPress={snap} />)
                : <Text style={s.hint}>{busy ? 'Menghantar…' : 'Halakan kamera ke kod QR.'}</Text>}
            </View></ScrollView>);
          }

          export default function App() {
            const [sess, setSess] = useState(undefined); const [view, setView] = useState('home');
            useEffect(() => { loadSession().then(setSess); }, []);
            const home = () => setView('home');
            const logout = async () => { await clearSession(); setSess(null); setView('home'); };
            let body;
            if (sess === undefined) body = <View style={s.center}><ActivityIndicator size="large" color={C.forest} /></View>;
            else if (!sess) body = <Register onDone={setSess} />;
            else if (view === 'mia') body = <Mia sess={sess} back={home} />;
            else if (view === 'qr') body = <Cam mode="qr" sess={sess} back={home} />;
            else if (view === 'geo') body = <Cam mode="photo" sess={sess} back={home} />;
            else body = <Dashboard sess={sess} go={setView} logout={logout} onSess={setSess} />;
            return (<SafeAreaView style={s.root}><StatusBar style="light" backgroundColor={C.forest} />{Platform.OS === 'android' ? <View style={{ height: RNBar.currentHeight || 0, backgroundColor: C.forest }} /> : null}{body}</SafeAreaView>);
          }

          const s = StyleSheet.create({
            root: { flex: 1, backgroundColor: C.bone }, center: { flex: 1, alignItems: 'center', justifyContent: 'center' },
            hero: { backgroundColor: C.forest, padding: 20, paddingTop: 28, paddingBottom: 26, borderBottomLeftRadius: 28 },
            logo: { color: '#fff', fontSize: 40, fontWeight: '800', letterSpacing: 1 }, heroSub: { color: '#BFD3C8', marginTop: 4 },
            heroHi: { color: '#BFD3C8', fontSize: 14 }, heroName: { color: '#fff', fontSize: 24, fontWeight: '700', marginTop: 2 },
            chips: { flexDirection: 'row', flexWrap: 'wrap', gap: 8, marginTop: 14 },
            chip: { flexDirection: 'row', alignItems: 'center', backgroundColor: C.forestSoft, paddingHorizontal: 12, paddingVertical: 6, borderRadius: 14 },
            chipT: { color: '#fff', fontSize: 12 }, dot: { width: 8, height: 8, borderRadius: 4, marginRight: 6 },
            top: { backgroundColor: C.forest, padding: 16, paddingBottom: 20 }, topT: { color: '#fff', fontSize: 22, fontWeight: '700', marginTop: 6 }, back: { color: '#BFD3C8' },
            card: { backgroundColor: C.card, borderRadius: 14, padding: 16, gap: 10, borderWidth: 1, borderColor: C.line },
            cardT: { fontSize: 16, fontWeight: '700', color: C.ink },
            row: { flexDirection: 'row', justifyContent: 'space-between', paddingVertical: 6, borderBottomWidth: 1, borderBottomColor: C.line, gap: 12 },
            rowK: { color: C.mute, flexShrink: 0 }, rowV: { color: C.ink, fontWeight: '600', flex: 1, textAlign: 'right' },
            grid: { flexDirection: 'row', gap: 10 },
            rowCol: { paddingVertical: 6, borderBottomWidth: 1, borderBottomColor: C.line }, rowVL: { color: C.ink, fontWeight: '600', marginTop:
