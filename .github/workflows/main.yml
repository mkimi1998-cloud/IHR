          import * as SecureStore from 'expo-secure-store';
          import * as Application from 'expo-application';

          // Recovered from the original iHR 1.0.2 bundle. Method and body shapes are inferred:
          // confirm them against the backend and adjust here only.
          export const BASE_URL = 'https://ihr.mtib.gov.my/';
          export const EP = {
            register:  { path: 'api/user_registration', method: 'POST', code: 'R' },
            dashboard: { path: 'api/dashboard',         method: 'POST', code: 'D', flip: true, retry: true },
            geotag:    { path: 'api/geotagging',        method: 'POST', code: 'G' },
            qr:        { path: 'api/qr_scanner',        method: 'POST', code: 'Q' },
            mia:       { path: 'api/mia_report',        method: 'POST', code: 'M' },
            reason:    { path: 'api/reason',            method: 'POST', code: 'P', flip: true, retry: true },
            reference: { path: 'api/reference',         method: 'POST', code: 'P', flip: true, retry: true },
          };

          let override = null;
          const realId = () => Application.getAndroidId() || 'unknown';
          export const deviceId = () => override || realId();
          // Lets the user reuse the ID the server already has for this phone (e.g. from the old iHR app).
          export async function saveDeviceId(v) {
            const t = (v || '').trim();
            if (!t || t === realId()) { override = null; await SecureStore.deleteItemAsync('DEVICE_ID'); }
            else { override = t; await SecureStore.setItemAsync('DEVICE_ID', t); }
          }

          async function once(ep, body, kind, signal) {
            const get = ep.method === 'GET';
            const headers = { Accept: 'application/json', imei: String(deviceId()) };
            let payload, qs = '';
            if (get) qs = '?' + Object.entries(body).map(([k, v]) => `${k}=${encodeURIComponent(v ?? '')}`).join('&');
            else if (kind === 'json') { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
            else if (kind === 'form') {
              headers['Content-Type'] = 'application/x-www-form-urlencoded';
              payload = Object.entries(body).map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v ?? '')}`).join('&');
            } else { payload = new FormData(); Object.entries(body).forEach(([k, v]) => payload.append(k, String(v ?? ''))); }
            const res = await fetch(BASE_URL + ep.path + qs, { method: ep.method, headers, body: payload, signal });
            return { status: res.status, ok: res.ok, text: await res.text() };
          }

          // Tries JSON, then form-urlencoded, then multipart when the server rejects the body format.
          export async function call(ep, body = {}) {
            // Only read-only endpoints may retry in other body formats; writes are sent exactly once.
            const kinds = ep.method === 'GET' || !ep.retry ? ['json'] : ['json', 'form', 'multipart'];
            let last = { status: 0, text: '' };
            for (let i = 0; i < kinds.length; i++) {
              const kind = kinds[i];
              if (kind === 'multipart' && Object.keys(body).length === 0) break; // empty FormData fails on Android
              const ctl = new AbortController();
              const t = setTimeout(() => ctl.abort(), 20000);
              try {
                const r = await once(ep, body, kind, ctl.signal);
                if (r.ok) { try { return JSON.parse(r.text); } catch { return { raw: r.text }; } }
                if (r.status === 405 && ep.flip) {
                  try {
                    const g = await once({ ...ep, method: ep.method === 'GET' ? 'POST' : 'GET' }, body, 'json', ctl.signal);
                    if (g.ok) { try { return JSON.parse(g.text); } catch { return { raw: g.text }; } }
                  } catch (_) { /* keep the original HTTP error */ }
                }
                last = r;
                if (![400, 405, 415, 422, 500].includes(r.status)) break;
              } catch (e) {
                if (i > 0 && last.status) break; // keep the real HTTP error, not a later retry's network error
                if (e.name === 'AbortError') throw new Error(`[${ep.code}001] Sambungan ke pelayan tamat masa`);
                throw new Error(`[${ep.code}003] Tiada sambungan ke pelayan. Sila semak sambungan internet anda.`);
              } finally { clearTimeout(t); }
            }
            const fail = (text) => { const err = new Error(text); err.status = last.status; return err; };
            if (last.status === 413) throw fail(`[${ep.code}413] Ralat Pelayan. Sila cuba sekali lagi`);
            // The server often answers with a plain JSON string message (e.g. "Nombor kakitangan tidak sah"): show it as is.
            let msg = null; try { const j = JSON.parse(last.text); if (typeof j === 'string') msg = j; else if (j && typeof j.message === 'string' && last.status !== 500) msg = j.message; } catch (_) {}
            if (msg) throw fail(msg);
            throw fail(`[${ep.code}00${last.status === 404 ? 1 : 2}] Ralat. Sila hubungi Bahagian Sumber Manusia untuk bantuan`);
          }

          const K = { no: 'STAFF_NO', id: 'STAFF_ID', name: 'STAFF_NAME' };
          export async function loadSession() {
            const dev = await SecureStore.getItemAsync('DEVICE_ID'); if (dev) override = dev;
            const [staff_no, staff_id, name] = await Promise.all(Object.values(K).map((k) => SecureStore.getItemAsync(k)));
            return staff_no ? { staff_no, staff_id, name } : null;
          }
          export async function saveSession(s) {
            await SecureStore.setItemAsync(K.no, String(s.staff_no));
            await SecureStore.setItemAsync(K.id, String(s.staff_id ?? ''));
            await SecureStore.setItemAsync(K.name, String(s.name ?? ''));
          }
          export const clearSession = () => Promise.all(Object.values(K).map((k) => SecureStore.deleteItemAsync(k)));

          // Times of geotagging sent from this app today (fallback until the server returns first/last tagging).
          const q2 = (n) => String(n).padStart(2, '0');
          const dayKey = () => { const d = new Date(); return `TAGS_${d.getFullYear()}-${q2(d.getMonth() + 1)}-${q2(d.getDate())}`; };
          export async function addLocalTag() {
            try { const k = dayKey(); const cur = JSON.parse((await SecureStore.getItemAsync(k)) || '[]'); cur.push(Date.now()); await SecureStore.setItemAsync(k, JSON.stringify(cur.slice(-20))); } catch (_) { /* optional */ }
          }
          export async function getLocalTags() {
            try { return JSON.parse((await SecureStore.getItemAsync(dayKey())) || '[]'); } catch (_) { return []; }
          }

          // Turns any server JSON into label/value rows so the dashboard shows whatever the API returns.
          export function rows(obj, prefix = '', out = []) {
            if (obj == null || out.length > 30) return out;
            if (typeof obj !== 'object') { out.push([prefix, String(obj)]); return out; }
            Object.entries(obj).forEach(([k, v]) => {
              const key = prefix ? `${prefix} · ${k}` : k;
              if (v && typeof v === 'object') rows(v, key, out);
              else if (v !== '' && String(v).length < 120) out.push([key.replace(/_/g, ' '), String(v)]);
            });
            return out;
          }
          export const unwrap = (r) => (r && (r.data ?? r.staff_data ?? r.result)) ?? r;
          IHR_EOF
