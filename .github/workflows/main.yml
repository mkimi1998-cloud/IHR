          function Dashboard({ sess, go, onSess, onLogout }) {
            const { C, s } = useT();
            const [data, setData] = useState(null); const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
            const [online, setOnline] = useState(null); const [at, setAt] = useState(''); const [tags, setTags] = useState([]);
            const [photo, setPhoto] = useState(null); const [badPhoto, setBadPhoto] = useState(false);
            const [tagDetails, setTagDetails] = useState([]);
            
            const [now, setNow] = useState(new Date());
            useEffect(() => {
              const timer = setInterval(() => setNow(new Date()), 1000);
              return () => clearInterval(timer);
            }, []);
            const h = now.getHours();
            const greeting = h < 12 ? 'Selamat Pagi' : h < 15 ? 'Selamat Tengah Hari' : h < 19 ? 'Selamat Petang' : 'Selamat Malam';
            
            const load = useCallback(async () => {
              setBusy(true); setErr('');
              try {
                const r = await call(EP.dashboard, { staff_no: sess.staff_no, staff_id: sess.staff_id });
                setData(r); setOnline(true); setAt(new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }));
                
                setTags(await getLocalTags());
                const d = new Date();
                const detailKey = `TAG_DETAILS_${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                const detailsStr = await SecureStore.getItemAsync(detailKey);
                if (detailsStr) setTagDetails(JSON.parse(detailsStr));
                
                { const p = findPhoto(r); if (p) { setPhoto(p); setBadPhoto(false); } }
                const sd = r?.staff_data;
                if (sd?.staff_id && String(sd.staff_id) !== String(sess.staff_id)) { const ns = { staff_no: String(sd.staff_no ?? sess.staff_no), staff_id: String(sd.staff_id), name: sd.name || sess.name }; saveSession(ns); onSess && onSess(ns); }
              } catch (e) {
                setOnline(false);
                setErr(e.message.includes('HTTP 500') ? e.message + '\n\nPeranti ini belum dikaitkan dengan akaun di pelayan. ID peranti: ' + deviceId() : e.message);
              } finally { setBusy(false); }
            }, [sess]);
            
            useEffect(() => { load(); }, [load]);
            
            const handleLogout = () => {
              Alert.alert('Daftar Keluar', 'Adakah anda pasti mahu kembali ke paparan pendaftaran?', [
                { text: 'Batal', style: 'cancel' },
                { text: 'Ya', onPress: async () => { await clearSession(); onLogout(sess); } }
              ]);
            };
            
            const getMethodIcon = (m) => {
              if (m === 'qr') return (
                <>
                  <MaterialIcons name="qr-code-2" size={18} color={C.ink} style={{ opacity: 0.7 }} />
                  <Text style={{ color: C.mute, fontSize: 12, marginLeft: 6, fontWeight: '600' }}>Imbas QR</Text>
                </>
              );
              if (m === 'geo') return (
                <>
                  <MaterialIcons name="map" size={18} color={C.ink} style={{ opacity: 0.7 }} />
                  <Text style={{ color: C.mute, fontSize: 12, marginLeft: 6, fontWeight: '600' }}>Geo Tagging</Text>
                </>
              );
              return null;
            };
            
            const sd = data?.staff_data || {};
            const name = sd.name || sess.name || 'Pengguna';
            const hasSrv = !!data && ('first_tagging' in data || 'last_tagging' in data);
            
            let first = hasSrv ? fromServer(data.first_tagging) : null; 
            let last = hasSrv ? fromServer(data.last_tagging) : null;
            let firstM = ''; 
            let lastM = '';
            
            if (!first && data?.msg?.clock_in) { const m = data.msg.clock_in.match(/\d{1,2}:\d{2}\s*(?:AM|PM)/i); if (m) first = m[0]; }
            if (!last && data?.msg?.clock_out) { const m = data.msg.clock_out.match(/\d{1,2}:\d{2}\s*(?:AM|PM)/i); if (m) last = m[0]; }
            
            if (tags.length > 0) {
              const minT = tags[0]; 
              const maxT = tags[tags.length - 1]; 
              if (!first) first = fromMs(minT.t);
              firstM = minT.m; 
              const serverLastMs = data?.last_tagging ? new Date(data.last_tagging.replace(' ', 'T')).getTime() : 0;
              if (maxT.t > serverLastMs || !last) {
                last = fromMs(maxT.t);
                lastM = maxT.m; 
              } else {
                lastM = maxT.m; 
              }
            } 
            
            const showTagInfo = (title, isFirst) => {
              const timeVal = isFirst ? first : last;
              const legacyMethod = isFirst ? firstM : lastM;
              const detail = isFirst ? tagDetails[0] : tagDetails[tagDetails.length - 1];
              if (!timeVal || timeVal === '—') {
                Alert.alert(title, "Belum ada rekod kehadiran.");
                return;
              }
              
              if (detail) {
                 const methodName = detail.m === 'qr' ? 'Imbas QR' : 'Geo Tagging';
                 Alert.alert(
                   `Maklumat ${title}`, 
                   `Kaedah: ${methodName}\nMasa: ${fromMs(detail.t)}\nLokasi: ${detail.address || 'Tidak diketahui'}`
                 );
              } else if (legacyMethod) {
                 const methodName = legacyMethod === 'qr' ? 'Imbas QR' : 'Geo Tagging';
                 Alert.alert(
                   `Maklumat ${title}`, 
                   `Kaedah: ${methodName}\nMasa: ${timeVal}\n\n*Lokasi terperinci tidak ditemui untuk sesi ini (Hanya terpakai untuk rekod baharu selepas kemas kini).*`
                 );
              } else {
                 Alert.alert(
                   `Maklumat ${title}`, 
                   `Masa: ${timeVal}\n\nRekod ini disegerakkan daripada pelayan web. Maklumat lokasi peranti tidak tersedia.`
                 );
              }
            };
            
            const ring = data ? colorOf(data.att_color, C.accent) : C.accent;
            
            return (
              <ScrollView contentContainerStyle={{ paddingBottom: 28 }}>
                <View style={s.dashTop}>
                  <View style={{ flexDirection: 'row', alignItems: 'center', gap: 8 }}>
                    <View style={{ backgroundColor: '#fff', borderRadius: 8, padding: 2 }}>
                       <Image source={require('./assets/icon.png')} style={{ width: 36, height: 36 }} resizeMode="contain" />
                    </View>
                    <Text style={{ color: C.ink, fontSize: 32, fontWeight: '800', letterSpacing: 0.5 }}>iHR</Text>
                  </View>
                  <View style={{ alignItems: 'flex-end' }}>
                    <Pressable onPress={handleLogout} style={s.status}>
                      <View style={[s.dot, { backgroundColor: online == null ? C.mute : online ? C.ok : C.bad }]} />
                      <Text style={s.statusT}>{online == null ? 'Menyemak…' : online ? `Dalam talian ${at}` : 'Luar talian'}</Text>
                    </Pressable>
                    <Pressable onPress={load} disabled={busy} hitSlop={10} style={{ paddingHorizontal: 10, paddingVertical: 6, marginTop: 8, flexDirection: 'row', alignItems: 'center', backgroundColor: C.field, borderRadius: 14, borderWidth: 1, borderColor: C.line }}>
                      {busy ? <ActivityIndicator size="small" color={C.primaryText} /> : (
                        <>
                          <MaterialIcons name="sync" size={16} color={C.primaryText} />
                          <Text style={{ fontSize: 12, color: C.primaryText, fontWeight: '700', marginLeft: 4 }}>Muat Semula</Text>
                        </>
                      )}
                    </Pressable>
                  </View>
                </View>
                <View style={s.profile}>
                  <Pressable onLongPress={() => Alert.alert('Medan data pelayan', data ? `${Object.keys(data).join(', ')}\n\nstaff_data: ${Object.keys(sd).join(', ') || '-'}\n\nGambar: ${photo ? 'dijumpai' : 'tiada'}` : 'Tiada data')}>
                    <View style={[s.ring, { borderColor: ring }]}><View style={s.ringIn}>
                      {photo && !badPhoto ? <Image source={photo.startsWith('data:') ? { uri: photo } : { uri: photo, headers: { imei: String(deviceId()) } }} style={s.ringImg} resizeMode="cover" onError={() => setBadPhoto(true)} /> : <Text style={s.ringT}>{name.trim()[0]?.toUpperCase() || 'I'}</Text>}
                    </View></View>
                  </Pressable>
                  <View style={s.pNameBox}>
                    <Text style={{ color: C.mute, fontSize: 16, fontWeight: '700', marginBottom: 4 }}>{greeting},</Text>
                    {wrapName(name).map((l, i) => <Text key={i} style={s.pName} numberOfLines={1}>{l}</Text>)}
                  </View>
                  <View style={s.chips}>
                    <View style={s.chip}><Text style={s.chipT}>No. staff {sd.staff_no ?? sess.staff_no}</Text></View>
                  </View>
                  {data ? <View style={s.pill}><Text style={s.pillT}>{data.msg?.clock_in || 'Belum ada rekod waktu masuk hari ini.'}</Text></View> : null}
                </View>
                
                <View style={{ paddingHorizontal: 16, gap: 14 }}>
                  <View style={{ alignItems: 'center', backgroundColor: C.card, paddingVertical: 18, borderRadius: 20, borderWidth: 1, borderColor: C.line, shadowColor: '#000', shadowOpacity: 0.05, shadowRadius: 8, elevation: 2 }}>
                    <Text style={{ fontSize: 38, fontWeight: '800', color: C.ink, letterSpacing: 1, fontVariant: ['tabular-nums'] }}>
                      {now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                    </Text>
                    <Text style={{ fontSize: 14, color: C.primary, fontWeight: '700', marginTop: 4, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                      {now.toLocaleDateString('ms-MY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                    </Text>
                  </View>
                  
                  <Err msg={err} />
                  {busy && !data ? <ActivityIndicator color={C.primaryText} /> : null}
                  {data ? (
                    <Card title="Hari ini" icon="🗓" tint={C.navy}>
                      <View style={s.statRow}>
                        <Stat icon="📍" label="First Tagging" value={first || '—'} tint={C.primary} methodIcon={firstM ? getMethodIcon(firstM) : null} onPress={() => showTagInfo('First Tagging', true)} />
                        <Stat icon="📌" label="Last Tagging" value={last || '—'} tint={C.navy} methodIcon={lastM ? getMethodIcon(lastM) : null} onPress={() => showTagInfo('Last Tagging', false)} />
                      </View>
                      {!hasSrv ? <Text style={s.note}>Masa tagging direkod daripada app ini sahaja.</Text> : null}
                      <Pressable onPress={() => Linking.openURL(PORTAL)} hitSlop={8}><Text style={s.link}>🌐 Lihat rekod kehadiran penuh di portal web ›</Text></Pressable>
                    </Card>
                  ) : null}
                  <View style={{ gap: 10 }}>
                    <Btn icon="📍" label="Geo Tagging" onPress={() => go('geo')} />
                    <Btn icon="📷" label="Imbas QR" onPress={() => go('qr')} />
                  </View>
                </View>
                
                <View style={{ marginTop: 32, marginBottom: 10, alignItems: 'center' }}>
                  <Text style={{ color: C.mute, fontSize: 12, fontWeight: '600' }}>Copyright © 2026 MTIB</Text>
                </View>
              </ScrollView>
            );
          }
          
          function useFix() {
            const [fix, setFix] = useState(null); const [err, setErr] = useState('');
            const get = useCallback(async () => {
              setErr('');
              const p = await Location.requestForegroundPermissionsAsync();
              if (p.status !== 'granted') return setErr('Tiada akses lokasi');
              try { const l = await Location.getCurrentPositionAsync({ accuracy: Location.Accuracy.High }); setFix(l.coords); }
              catch { setErr('Peranti tidak dapat mengesan lokasi anda'); }
            }, []);
            useEffect(() => { get(); }, [get]);
            return { fix, err, get, setFix };
          }
          
          const Loc = ({ fix, err, get }) => {
            const { C } = useT(); const [open, setOpen] = useState(false);
            const summary = fix ? `${fix.latitude.toFixed(5)}, ${fix.longitude.toFixed(5)} · ± ${Math.round(fix.accuracy || 0)} m` : (err || 'Mengesan lokasi…');
            return (
              <Collapse title="Lokasi semasa" icon="🛰" tint={C.navy} summary={summary} warn={!fix && !!err} open={open} onToggle={() => setOpen(!open)}>
                {fix ? <>
                  <Row icon="🧭" k="Latitud" v={fix.latitude.toFixed(6)} tint={C.navy} />
                  <Row icon="🧭" k="Longitud" v={fix.longitude.toFixed(6)} tint={C.navy} />
                  <Row icon="🎯" k="Ketepatan" v={`± ${Math.round(fix.accuracy || 0)} m`} tint={C.primary} last /></>
                  : <Text style={{ color: C.mute }}>{err || 'Mengesan lokasi…'}</Text>}
                <Err msg={fix ? '' : err} />
                <Btn kind="ghost" icon="🔄" label="Kesan semula" onPress={get} />
              </Collapse>
            );
          };
          
          function Cam({ mode, sess, back }) {
            const { C, s } = useT();
            const [perm, ask] = useCameraPermissions(); const ref = useRef(null); const loc = useFix();
            const [shot, setShot] = useState(null); const [done, setDone] = useState(false);
            const [act, setAct] = useState(null); const [actOpen, setActOpen] = useState(false); const [sd, setSd] = useState(todayStr()); const [ed, setEd] = useState(todayStr());
            const [klType, setKlType] = useState(''); const [reason, setReason] = useState(''); const [opts, setOpts] = useState(KERJA_LUAR_TYPES.map((label) => ({ label })));
            const [busy, setBusy] = useState(false); const [err, setErr] = useState(''); const [ok, setOk] = useState('');
            const [askPwd, setAskPwd] = useState(false);
            const [unlocked, setUnlocked] = useState(false);
            const [pwd, setPwd] = useState('');
            const [useLoc, setUseLoc] = useState(true);

          
            useEffect(() => { if (perm && !perm.granted) ask(); }, [perm]);
            useEffect(() => {
              if (mode !== 'photo') return undefined; let on = true;
              call(EP.reason, {}).then((r) => { const m = matchReasons(r); if (on && m) setOpts(m); }).catch(() => {});
              return () => { on = false; };
            }, [mode]);
            
            const base = { staff_id: sess.staff_id };
            const need = () => (sess.staff_id ? '' : 'ID staff belum dimuatkan. Kembali ke Dashboard dan tunggu data dimuat.');
            
            const onQr = async ({ data }) => {
              if (done) return; if (need()) return setErr(need()); setDone(true); setBusy(true); setErr('');
                try {
                  const lat = useLoc ? loc.fix?.latitude : undefined;
                  const lng = useLoc ? loc.fix?.longitude : undefined;
                  const r = await call(EP.qr, { ...base, method: 'qr', qr_code: data, latitude: lat, longitude: lng });
                  await addLocalTag('qr');
                  await saveTagDetails('qr', lat, lng);
                  setOk(typeof r === 'string' ? r : 'Imbasan QR berjaya.');
                } catch (e) { setErr(e.message); } finally { setBusy(false); }
              };
              
              const pickQr = async () => {
                const res = await ImagePicker.launchImageLibraryAsync({ mediaTypes: ImagePicker.MediaTypeOptions.Images });
                if (!res.canceled && res.assets[0]) {
                  setBusy(true); setErr(''); setDone(true);
                  try {
                    const scanned = await BarCodeScanner.scanFromURLAsync(res.assets[0].uri);
                    if (scanned && scanned.length > 0) {
                      const lat = useLoc ? loc.fix?.latitude : undefined;
                      const lng = useLoc ? loc.fix?.longitude : undefined;
                      const r = await call(EP.qr, { ...base, method: 'qr', qr_code: scanned[0].data, latitude: lat, longitude: lng });
                      await addLocalTag('qr');
                      await saveTagDetails('qr', lat, lng);
                      setOk(typeof r === 'string' ? r : 'Muat naik QR berjaya.');
                    } else {
                      setErr('Kod QR tidak dikesan dalam gambar.'); setDone(false);
                    }
                  } catch (e) {
                    setErr(e.message || 'Ralat membaca gambar QR.'); setDone(false);
                  } finally { setBusy(false); }
                }
              };

            const snap = async () => { 
              const p = await ref.current?.takePictureAsync({ quality: 0.5 }); 
              if (p) {
                const resized = await ImageManipulator.manipulateAsync(
                  p.uri,
                  [{ resize: { width: 800 } }],
                  { compress: 0.5, format: ImageManipulator.SaveFormat.JPEG, base64: true }
                );
                setShot(resized); 
              } 
            };
            
            const sendPhoto = () => {
              if (need()) return setErr(need()); if (!act) { setActOpen(true); return setErr('Sila pilih jenis kehadiran'); }
              if (!shot) return setErr('Sila muat naik gambar'); if (!loc.fix) return setErr('Tiada akses lokasi');
              const payload = { ...base, activity_type: act, latitude: loc.fix.latitude, longitude: loc.fix.longitude, img: shot.base64 };
              if (act === 3) {
                if (!klType) return setErr('Sila pilih jenis kerja luar');
                if (!reason.trim()) return setErr('Sila isi alasan');
                if (ed < sd) return setErr('Tarikh akhir tidak boleh sebelum tarikh mula');
                payload.start_date = sd; payload.end_date = ed;
                Object.assign(payload, kerjaLuarFields(opts.find((o) => o.label === klType), reason.trim()));
              }
              const label = ACTS.find(([v]) => v === act)[1];
              Alert.alert('Sahkan penghantaran', `Rekod kehadiran "${label}" akan disimpan dalam sistem iHR.`, [
                { text: 'Batal', style: 'cancel' },
                { text: 'Hantar', onPress: async () => {
                  setBusy(true); setErr('');
                  try { 
                    const r = await call(EP.geotag, payload); 
                    await addLocalTag('geo'); 
                    await saveTagDetails('geo', loc.fix.latitude, loc.fix.longitude);
                    setOk(typeof r === 'string' ? r : 'Geotagging berjaya dihantar.'); 
                  } catch (e) { setErr(e.message); } finally { setBusy(false); }
                } },
              ]);
            };
            
            if (!perm?.granted) return (<View style={{ flex: 1 }}><Top title="Kamera" onBack={back} /><View style={{ padding: 16, gap: 12 }}><Text style={{ color: C.ink }}>Tiada akses kamera.</Text><Btn label="Benarkan kamera" onPress={ask} /></View></View>);
            
            return (
              <ScrollView keyboardShouldPersistTaps="handled">
                <Top title={mode === 'qr' ? 'Imbas QR' : 'Geotagging'} onBack={back} onTitleLongPress={() => setAskPwd(!askPwd)} />
                {askPwd && !unlocked && (
                  <View style={{ padding: 16, gap: 10 }}>
                    <TextInput 
                      style={s.in} 
                      secureTextEntry 
                      placeholder="Kata laluan admin" 
                      placeholderTextColor={C.mute}
                      value={pwd} 
                      onChangeText={t => {
                        setPwd(t);
                        if (t.trim() === 'Mtib@123') { setUnlocked(true); setAskPwd(false); setPwd(''); }
                      }}
                      onSubmitEditing={() => {
                        if (pwd.trim() === 'Mtib@123') { setUnlocked(true); setAskPwd(false); setPwd(''); }
                        else { Alert.alert('Ralat', 'Kata laluan salah'); setPwd(''); }
                      }}
                    />
                    <Btn label="Sahkan" onPress={() => {
                      if (pwd.trim() === 'Mtib@123') { setUnlocked(true); setAskPwd(false); setPwd(''); }
                      else { Alert.alert('Ralat', 'Kata laluan salah'); setPwd(''); }
                    }} />
                  </View>
                {unlocked && (
                  <View style={{ padding: 16, gap: 10 }}>
                    <View style={{ flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between' }}>
                      <Text style={s.lbl}>Gunakan Lokasi Semasa</Text>
                      <Switch value={useLoc} onValueChange={setUseLoc} trackColor={{ true: C.primary }} />
                    </View>
                    <Text style={s.lbl}>Manual Latitud</Text>
                    <TextInput style={s.in} keyboardType="numeric" value={String(loc.fix?.latitude || '')} onChangeText={t => loc.setFix(f => ({...f, latitude: parseFloat(t) || 0, accuracy: 1}))} />
                    <Text style={s.lbl}>Manual Longitud</Text>
                    <TextInput style={s.in} keyboardType="numeric" value={String(loc.fix?.longitude || '')} onChangeText={t => loc.setFix(f => ({...f, longitude: parseFloat(t) || 0, accuracy: 1}))} />
                    {mode === 'qr' && (
                      <Btn label="Muat Naik QR dari Galeri" onPress={pickQr} icon="🖼" kind="ghost" />
                    )}
                  </View>
                )}

                <View style={{ padding: 16, gap: 14 }}>
                {shot ? <Image source={{ uri: shot.uri }} style={s.cam} /> :
                  <CameraView ref={ref} style={s.cam} facing={mode === 'qr' ? 'back' : 'front'} barcodeScannerSettings={{ barcodeTypes: ['qr'] }} onBarcodeScanned={mode === 'qr' ? onQr : undefined} />}
                <Loc {...loc} />
                {mode === 'photo' ? (
                  <Collapse title="Jenis kehadiran" icon="🗂" tint={C.primary} summary={act ? ACTS.find(([v]) => v === act)[1] : 'Pilih jenis kehadiran'} strong={!!act} open={actOpen} onToggle={() => setActOpen(!actOpen)}>
                    {ACTS.map(([v, l]) => (<Pressable key={v} onPress={() => { setAct(v); setActOpen(false); }} style={[s.opt, act === v && s.optOn]}><Text style={{ color: act === v ? C.onPrimary : C.ink, fontWeight: '600' }}>{l}</Text></Pressable>))}
                  </Collapse>
                ) : null}
                {mode === 'photo' && act === 3 ? (<Card title="Butiran Kerja Luar" icon="🧳" tint={C.primary}>
                    <Text style={s.lbl}>Jenis Kerja Luar</Text>
                    <Select value={klType} placeholder="Pilih Jenis Kerja Luar" options={opts.map((o) => o.label)} onPick={setKlType} />
                    <Text style={s.lbl}>Alasan</Text>
                    <TextInput style={[s.in, { minHeight: 48 }]} value={reason} onChangeText={setReason} placeholder="Nyatakan alasan" placeholderTextColor={C.mute} multiline />
                    <Text style={s.lbl}>Tarikh Mula</Text>
                    <DateField value={sd} min={todayStr()} onPick={(v) => { setSd(v); if (ed < v) setEd(v); }} />
                    <Text style={s.lbl}>Tarikh Akhir</Text>
                    <DateField value={ed} min={sd} onPick={setEd} />
                </Card>) : null}
                <Err msg={err} /><Ok msg={ok} />
                {mode === 'photo' ? (shot ? <><Btn icon="📤" label="Hantar gambar" onPress={sendPhoto} busy={busy} /><Btn kind="ghost" icon="🔄" label="Ambil semula" onPress={() => { setShot(null); setOk(''); }} /></> : <Btn icon="📷" label="Ambil Gambar" onPress={snap} />)
                  : (done && !busy ? <Btn kind="ghost" icon="🔄" label="Imbas semula" onPress={() => { setDone(false); setErr(''); setOk(''); }} /> : <Text style={s.hint}>{busy ? 'Menghantar…' : 'Halakan kamera ke kod QR.'}</Text>)}
              </View></ScrollView>
            );
          }
          
          export default function App() {
            const scheme = useColorScheme() === 'dark' ? 'dark' : 'light';
            const C = themes[scheme];
            const s = useMemo(() => makeStyles(C), [scheme]);
            const [sess, setSess] = useState(undefined); const [view, setView] = useState('home');
            const [logoutData, setLogoutData] = useState(null);
            
            useEffect(() => { loadSession().then(setSess); }, []);
            const home = () => setView('home');
            
            let body;
            if (sess === undefined) body = <View style={s.center}><ActivityIndicator size="large" color={C.primary} /></View>;
            else if (!sess) body = <Register onDone={setSess} initialName={logoutData?.name || ''} initialNo={logoutData?.staff_no || ''} />;
            else if (view === 'qr') body = <Cam mode="qr" sess={sess} back={home} />;
            else if (view === 'geo') body = <Cam mode="photo" sess={sess} back={home} />;
            else body = <Dashboard sess={sess} go={setView} onSess={setSess} onLogout={(oldSess) => { setLogoutData(oldSess); setSess(null); }} />;
            
            return (<ThemeCtx.Provider value={{ C, s, scheme }}><SafeAreaView style={s.root}><StatusBar style={scheme === 'dark' ? 'light' : 'dark'} backgroundColor={C.bg} />{Platform.OS === 'android' ? <View style={{ height: RNBar.currentHeight || 0, backgroundColor: C.bg }} /> : null}{body}</SafeAreaView></ThemeCtx.Provider>);
          }
          
          const makeStyles = (C) => StyleSheet.create({
            root: { flex: 1, backgroundColor: C.bg }, center: { flex: 1, alignItems: 'center', justifyContent: 'center' },
            logo: { color: C.ink, fontSize: 38, fontWeight: '800', letterSpacing: 0.5, textAlign: 'center' }, sub: { color: C.mute, marginTop: 2, textAlign: 'center' },
            regTop: { flexDirection: 'row', alignItems: 'flex-start', padding: 20, paddingTop: 16 },
            regTopCentered: { alignItems: 'center', padding: 20, paddingTop: 30 },
            gear: { width: 42, height: 42, borderRadius: 21, backgroundColor: C.card, borderWidth: 1, borderColor: C.line, alignItems: 'center', justifyContent: 'center' },
            gearOn: { borderColor: C.primary, backgroundColor: C.primarySoft }, gearT: { fontSize: 20 },
            dashTop: { flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', paddingHorizontal: 20, paddingTop: 10 },
            status: { flexDirection: 'row', alignItems: 'center', backgroundColor: C.card, borderWidth: 1, borderColor: C.line, borderRadius: 16, paddingHorizontal: 12, paddingVertical: 6 },
            statusT: { color: C.ink, fontSize: 12, fontWeight: '600' }, dot: { width: 8, height: 8, borderRadius: 4, marginRight: 6 },
            profile: { alignItems: 'center', paddingHorizontal: 20, paddingVertical: 18, gap: 12 },
            ring: { width: 150, height: 150, borderRadius: 75, borderWidth: 11, alignItems: 'center', justifyContent: 'center' },
            ringIn: { width: 112, height: 112, borderRadius: 56, backgroundColor: C.card, borderWidth: 1, borderColor: C.line, alignItems: 'center', justifyContent: 'center', overflow: 'hidden' },
            ringImg: { width: '100%', height: '100%' },
            sel: { flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between' },
            selList: { borderWidth: 1, borderColor: C.line, borderRadius: 12, backgroundColor: C.field, overflow: 'hidden' },
            selItem: { paddingVertical: 13, paddingHorizontal: 14, borderBottomWidth: 1, borderBottomColor: C.line },
            ringT: { color: C.primaryText, fontSize: 48, fontWeight: '800' },
            pNameBox: { alignItems: 'center' },
            pName: { color: C.ink, fontSize: 20, fontWeight: '700', textAlign: 'center' },
            chips: { flexDirection: 'row', flexWrap: 'wrap', gap: 8, justifyContent: 'center' },
            chip: { backgroundColor: C.card, borderWidth: 1, borderColor: C.line, borderRadius: 14, paddingHorizontal: 12, paddingVertical: 5 }, chipT: { color: C.ink, fontSize: 12, fontWeight: '600' },
            pill: { backgroundColor: C.pill, borderRadius: 22, paddingHorizontal: 18, paddingVertical: 10, alignSelf: 'stretch' },
            pillT: { color: C.navy, textAlign: 'center', fontWeight: '500' },
            top: { backgroundColor: C.card, padding: 16, paddingBottom: 14, borderBottomWidth: 1, borderBottomColor: C.line },
            topT: { color: C.ink, fontSize: 24, fontWeight: '800' }, back: { color: C.primaryText, fontWeight: '600' },
            card: { backgroundColor: C.card, borderRadius: 16, padding: 14, gap: 10, borderWidth: 1, borderColor: C.line },
            cardH: { flexDirection: 'row', alignItems: 'center', gap: 10, paddingBottom: 2 }, cardT: { fontSize: 16, fontWeight: '700', color: C.ink },
            row: { flexDirection: 'row', alignItems: 'center', gap: 10, paddingVertical: 9, borderBottomWidth: 1, borderBottomColor: C.line },
            rowK: { color: C.mute, flexShrink: 0 }, rowV: { color: C.ink, fontWeight: '600', flex: 1, textAlign: 'right' }, rowV2: { color: C.ink, fontWeight: '700', marginTop: 2 },
            statRow: { flexDirection: 'row', gap: 10 },
            stat: { flex: 1, borderWidth: 1, borderColor: C.line, borderRadius: 14, padding: 12, backgroundColor: C.field },
            statH: { flexDirection: 'row', alignItems: 'center', gap: 8 }, statL: { color: C.mute, fontSize: 12, fontWeight: '600', flexShrink: 1 },
            statV: { color: C.ink, fontSize: 22, fontWeight: '800', marginTop: 10 },
            note: { color: C.mute, fontSize: 12 },
            link: { color: C.primaryText, fontWeight: '700', paddingTop: 4 },
            swatchRow: { flexDirection: 'row', alignItems: 'center', gap: 14 }, swatch: { width: 40, height: 40, borderRadius: 20, borderWidth: 1, borderColor: C.line },
            lbl: { color: C.mute, fontSize: 13 }, in: { borderWidth: 1, borderColor: C.line, borderRadius: 12, padding: 12, fontSize: 16, backgroundColor: C.field, color: C.ink },
            btn: { backgroundColor: C.primary, borderRadius: 28, paddingVertical: 15, paddingHorizontal: 18, alignItems: 'center', justifyContent: 'center' },
            btnGhost: { backgroundColor: 'transparent', borderWidth: 1.5, borderColor: C.primaryText },
            btnIn: { flexDirection: 'row', alignItems: 'center', gap: 8 }, btnIc: { fontSize: 16 }, btnTx: { color: C.onPrimary, fontWeight: '700', fontSize: 16 },
            err: { backgroundColor: C.badBg, padding: 12, borderRadius: 12, borderWidth: 1, borderColor: C.badLine },
            okBox: { backgroundColor: C.okBg, padding: 12, borderRadius: 12, borderWidth: 1, borderColor: C.okLine },
            hint: { color: C.mute, textAlign: 'center' },
            opt: { padding: 13, borderRadius: 12, borderWidth: 1, borderColor: C.line, backgroundColor: C.field }, optOn: { backgroundColor: C.primary, borderColor: C.primary },
            cam: { height: 300, borderRadius: 16, overflow: 'hidden', backgroundColor: '#000', borderWidth: 1, borderColor: C.line },
          });
          IHR_EOF
          cat > 'src/api.js' <<'IHR_EOF'
          import * as SecureStore from 'expo-secure-store';
          import * as Application from 'expo-application';
          // Recovered from the original iHR 1.0.2 bundle. Method and body shapes are inferred:
          // confirm them against the backend and adjust here only.
          export const BASE_URL = 'https://ihr.mtib.gov.my/';
          export const EP = {
          register:  { path: 'api/user_registration', method: 'POST', code: 'R', retry: true },
          dashboard: { path: 'api/dashboard',         method: 'POST', code: 'D', flip: true, retry: true },
          geotag:    { path: 'api/geotagging',        method: 'POST', code: 'G', retry: true },
          qr:        { path: 'api/qr_scanner',        method: 'POST', code: 'Q', retry: true },
          mia:       { path: 'api/mia_report',        method: 'POST', code: 'M', retry: true },
          reason:    { path: 'api/reason',            method: 'POST', code: 'P', flip: true, retry: true },
          reference: { path: 'api/reference',         method: 'POST', code: 'P', flip: true, retry: true },
          };
          let override = null;
          const realId = () => Application.getAndroidId() || 'unknown';
          export const deviceId = () => override || realId();
          // Lets the user reuse the ID the server already has for this phone (e.g. from the old iHR app).
          export async function saveDeviceId(v) {
            const t = (v || '').trim();
            if (!t || t === realId()) { override = null; await SecureStore.deleteItemAsync('DEVICE_ID'); }
            else { override = t; await SecureStore.setItemAsync('DEVICE_ID', t); }
          }
          async function once(ep, body, kind, signal) {
            const get = ep.method === 'GET';
            const headers = { Accept: 'application/json', imei: String(deviceId()) };
            let payload, qs = '';
            if (get) qs = '?' + Object.entries(body).map(([k, v]) => `${k}=${encodeURIComponent(v ?? '')}`).join('&');
            else if (kind === 'json') { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
            else if (kind === 'form') {
              headers['Content-Type'] = 'application/x-www-form-urlencoded';
              payload = Object.entries(body).map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v ?? '')}`).join('&');
            } else { payload = new FormData(); Object.entries(body).forEach(([k, v]) => payload.append(k, String(v ?? ''))); }
            const res = await fetch(BASE_URL + ep.path + qs, { method: ep.method, headers, body: payload, signal });
            return { status: res.status, ok: res.ok, text: await res.text() };
          }
          // Tries JSON, then form-urlencoded, then multipart when the server rejects the body format.
          export async function call(ep, body = {}) {
            // Only read-only endpoints may retry in other body formats; writes are sent exactly once.
            const kinds = ep.method === 'GET' || !ep.retry ? ['json'] : ['json', 'form', 'multipart'];
            let last = { status: 0, text: '' };
            for (let i = 0; i < kinds.length; i++) {
              const kind = kinds[i];
              if (kind === 'multipart' && Object.keys(body).length === 0) break; // empty FormData fails on Android
              const ctl = new AbortController();
              const t = setTimeout(() => ctl.abort(), 20000);
              try {
                const r = await once(ep, body, kind, ctl.signal);
                if (r.ok) { try { return JSON.parse(r.text); } catch { return { raw: r.text }; } }
                if (r.status === 405 && ep.flip) {
                  try {
                    const g = await once({ ...ep, method: ep.method === 'GET' ? 'POST' : 'GET' }, body, 'json', ctl.signal);
                    if (g.ok) { try { return JSON.parse(g.text); } catch { return { raw: g.text }; } }
                  } catch (_) { /* keep the original HTTP error */ }
                }
                last = r;
                if (![400, 405, 415, 422, 500].includes(r.status)) break;
              } catch (e) {
                if (i > 0 && last.status) break; // keep the real HTTP error, not a later retry's network error
                if (e.name === 'AbortError') throw new Error(`[${ep.code}001] Sambungan ke pelayan tamat masa`);
                throw new Error(`[${ep.code}003] Tiada sambungan ke pelayan (${e.message})`);
              } finally { clearTimeout(t); }
            }
            if (last.status === 413) throw new Error(`[${ep.code}413] Ralat Pelayan. Sila cuba sekali lagi`);
            // The server often answers with a plain JSON string message (e.g. late clock-in): show it as is.
            let msg = null; try { const j = JSON.parse(last.text); if (typeof j === 'string') msg = j; else if (j && typeof j.message === 'string' && last.status !== 500) msg = j.message; } catch (_) {}
            if (msg) throw new Error(`${msg}`);
            const snip = String(last.text).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 220);
            throw new Error(`[${ep.code}00${last.status === 404 ? 1 : 2}] Ralat. Sila hubungi Bahagian Sumber Manusia untuk bantuan\nHTTP ${last.status}: ${snip}`);
          }
          const K = { no: 'STAFF_NO', id: 'STAFF_ID', name: 'STAFF_NAME' };
          export async function loadSession() {
            const dev = await SecureStore.getItemAsync('DEVICE_ID'); if (dev) override = dev;
            const [staff_no, staff_id, name] = await Promise.all(Object.values(K).map((k) => SecureStore.getItemAsync(k)));
            return staff_no ? { staff_no, staff_id, name } : null;
          }
          export async function saveSession(s) {
            await SecureStore.setItemAsync(K.no, String(s.staff_no));
            await SecureStore.setItemAsync(K.id, String(s.staff_id ?? ''));
            await SecureStore.setItemAsync(K.name, String(s.name ?? ''));
          }
          export const clearSession = () => Promise.all(Object.values(K).map((k) => SecureStore.deleteItemAsync(k)));
          // Times of geotagging sent from this app today (fallback until the server returns first/last tagging).
          const q2 = (n) => String(n).padStart(2, '0');
          const dayKey = () => { const d = new Date(); return `TAGS_${d.getFullYear()}-${q2(d.getMonth() + 1)}-${q2(d.getDate())}`; };
          export async function addLocalTag(method = 'geo') {
          try { 
            const k = dayKey(); 
            const cur = JSON.parse((await SecureStore.getItemAsync(k)) || '[]'); 
            cur.push({ t: Date.now(), m: method }); 
            await SecureStore.setItemAsync(k, JSON.stringify(cur.slice(-20))); 
          } catch (_) { /* optional */ }
          }
          export async function getLocalTags() {
            try { 
              const raw = JSON.parse((await SecureStore.getItemAsync(dayKey())) || '[]'); 
              // Format legacy numbers as geo, otherwise return new object structure
              return raw.map(x => typeof x === 'number' ? { t: x, m: 'geo' } : x);
            } catch (_) { return []; }
          }
          // Turns any server JSON into label/value rows so the dashboard shows whatever the API returns.
          export function rows(obj, prefix = '', out = []) {
            if (obj == null || out.length > 30) return out;
            if (typeof obj !== 'object') { out.push([prefix, String(obj)]); return out; }
            Object.entries(obj).forEach(([k, v]) => {
              const key = prefix ? `${prefix} · ${k}` : k;
              if (v && typeof v === 'object') rows(v, key, out);
              else if (v !== '' && String(v).length < 120) out.push([key.replace(/_/g, ' '), String(v)]);
            });
            return out;
          }
          export const unwrap = (r) => (r && (r.data ?? r.staff_data ?? r.result)) ?? r;
          // ---- Staff photo (shown inside the yellow ring) ----
          // Finds a photo in the dashboard JSON whatever the field is called: full URL, relative path, or base64.
          const PHOTO_KEY = /(photo|image|img|picture|pic|avatar|gambar|foto|profile)/i;
          const NOT_PHOTO = /(color|colour|type|count|msg|status|path_id)/i;
          function toUri(v) {
            const s = String(v).trim();
            if (/^data:image\//i.test(s)) return s;
            if (/^https?:\/\//i.test(s)) return s.replace(/^http:\/\/ihr\.mtib\.gov\.my/i, 'https://ihr.mtib.gov.my');
            if (/^[A-Za-z0-9+/=\s]{200,}$/.test(s)) return 'data:image/jpeg;base64,' + s.replace(/\s+/g, '');
            if (s.length < 300 && !/\s/.test(s) && /[\/.]/.test(s)) return BASE_URL + s.replace(/^\/+/, '');
            return null;
          }
          export function findPhoto(r) {
            const seen = new Set();
            const walk = (o, d) => {
              if (!o || typeof o !== 'object' || d > 3 || seen.has(o)) return null;
              seen.add(o);
              for (const [k, v] of Object.entries(o)) {
                if (typeof v === 'string' && v.length > 3 && PHOTO_KEY.test(k) && !NOT_PHOTO.test(k)) { const u = toUri(v); if (u) return u; }
              }
              for (const v of Object.values(o)) { if (v && typeof v === 'object') { const u = walk(v, d + 1); if (u) return u; } }
              return null;
            };
            return walk(r, 0);
          }
          // ---- Kerja Luar (outside work) ----
          export const KERJA_LUAR_TYPES = ['Mesyuarat', 'Kursus', 'Bengkel', 'Lawatan Tapak', 'Pameran', 'Lain-lain'];
          const norm = (x) => String(x || '').toLowerCase().replace(/[^a-z]/g, '');
          // Looks for the same six types in the server's reason list and keeps their ids; null if the list is something else.
          export function matchReasons(r) {
            const arr = Array.isArray(r) ? r : [r?.data, r?.reasons, r?.reason, r?.result].find(Array.isArray);
            if (!arr) return null;
            const items = arr.map((x) => (typeof x === 'string' ? { label: x } : { id: x?.id ?? x?.value ?? x?.code, label: x?.name ?? x?.label ?? x?.reason ?? x?.description ?? x?.title }));
            const out = KERJA_LUAR_TYPES.map((label) => ({ label, id: items.find((i) => norm(i.label) === norm(label))?.id }));
            return out.filter((o) => o.id !== undefined).length >= 3 ? out : null;
          }
          // Field names are inferred (not recovered from the original). Change them here only if the server ignores them.
          export const kerjaLuarFields = (opt, reason) => {
            const label = opt?.label || '';
            const o = { reason_type: label, outstation_type: label, kerja_luar_type: label, reason, remark: reason, alasan: reason };
            if (opt?.id !== undefined) o.reason_id = opt.id;
            return o;
          };
          IHR_EOF
          cat > 'src/theme.js' <<'IHR_EOF'
          // Palette taken from the original iHR screen: warm grey, terracotta buttons, card-color yellow, navy text.
          // Two palettes: `light` and `dark`. The app picks one from the phone's system theme.
          export const light = {
            bg: '#EEEDEE', card: '#FFFFFF', line: '#D9D5D7', ink: '#14141A', mute: '#6B6B75', field: '#FAF9FA',
            primary: '#BC4A32', primaryText: '#BC4A32', primarySoft: '#F6E4DF', onPrimary: '#FFFFFF',
            accent: '#FDC107', navy: '#1F2D55', pill: '#CDD3DB',
            ok: '#2E7D4F', okBg: '#E5F3EA', okLine: '#BFE0CB', bad: '#B3261E', badBg: '#FBE9E7', badLine: '#F2C6C1',
          };
          export const dark = {
            bg: '#121214', card: '#1D1D21', line: '#34343B', ink: '#F2F2F5', mute: '#A3A3AE', field: '#26262B',
            primary: '#C4513A', primaryText: '#FF8F75', primarySoft: '#3A2420', onPrimary: '#FFFFFF',
            accent: '#FDC107', navy: '#A9BBEA', pill: '#2B3245',
            ok: '#7FD6A0', okBg: '#16301F', okLine: '#2C5A40', bad: '#FFB4AB', badBg: '#3C1F1D', badLine: '#6B2E2A',
          };
          export const themes = { light, dark };
          IHR_EOF
          ls -R . | head -20
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install --legacy-peer-deps
        working-directory: app
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: app
      - name: Fix missing splash color
        run: |
          F=android/app/src/main/res/values/colors.xml
          mkdir -p "$(dirname "$F")"
          [ -f "$F" ] || printf '<resources>\n</resources>\n' > "$F"
          grep -q splashscreen_background "$F" || sed -i 's|</resources>|  <color name="splashscreen_background">#FFFFFF</color>\n</resources>|' "$F"
          cat "$F"
        working-directory: app
      - name: Point Gradle at the SDK and harden downloads
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          {
            echo "systemProp.org.gradle.internal.http.connectionTimeout=180000"
            echo "systemProp.org.gradle.internal.http.socketTimeout=180000"
            echo "systemProp.org.gradle.internal.repository.max.retries=8"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=2000"
          } >> android/gradle.properties
        working-directory: app
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/package.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build APK (retries on network errors)
        run: |
          chmod +x gradlew
          n=0
          until ./gradlew assembleRelease --no-daemon; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "Build failed after $n tries"; exit 1; fi
            echo "Retrying in 30s (try $((n+1)) of 3)..."; sleep 30
          done
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with:
          name: iHR-apk
          path: app/android/app/build/outputs/apk/release/*.apk
