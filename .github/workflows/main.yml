name: Build iHR Multi-Platform (IPA, AAB & APK)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Platform to build (all, android, ios)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - ios
      macos_runner:
        description: "macOS runner label for iOS build"
        required: true
        default: "macos-14"
        type: choice
        options:
          - macos-14
          - macos-15
          - macos-latest
jobs:
  android:
    name: Build Android (AAB & APK)
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'android' || github.event.inputs.target == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Locate project folder and set build number
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          P=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          [ -z "$P" ] && { echo "No package.json found in repo."; exit 1; }
          APP_DIR=$(dirname "$P")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          sed -i "s/\"versionCode\": [0-9]*/\"versionCode\": $BUILD_NUM/" "$APP_DIR/app.json"
          sed -i "s/\"buildNumber\": \"[0-9]*\"/\"buildNumber\": \"$BUILD_NUM\"/" "$APP_DIR/app.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: ${{ env.APP_DIR }}
      - name: Fix missing splash color
        run: |
          F=android/app/src/main/res/values/colors.xml
          mkdir -p "$(dirname "$F")"
          [ -f "$F" ] || printf '<resources>\n</resources>\n' > "$F"
          grep -q splashscreen_background "$F" || sed -i 's|</resources>|  <color name="splashscreen_background">#FFFFFF</color>\n</resources>|' "$F"
        working-directory: ${{ env.APP_DIR }}
      - name: Point Gradle at the SDK and harden downloads
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          {
            echo "systemProp.org.gradle.internal.http.connectionTimeout=180000"
            echo "systemProp.org.gradle.internal.http.socketTimeout=180000"
            echo "systemProp.org.gradle.internal.repository.max.retries=8"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=2000"
          } >> android/gradle.properties
        working-directory: ${{ env.APP_DIR }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: gradle-npm-${{ runner.os }}-
      - name: Configure Play Store Upload Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/mtib-upload-key.keystore
          else
            STORE_PASS="MtibPlayStore2026!"
            KEY_ALIAS="ihr-upload-key"
            KEY_PASS="MtibPlayStore2026!"
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore android/app/mtib-upload-key.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=MTIB iHR, OU=BTM, O=Lembaga Perindustrian Kayu Malaysia, L=Cheras, S=Kuala Lumpur, C=MY"
          fi
          cat >> android/gradle.properties <<EOF
          MYAPP_UPLOAD_STORE_FILE=mtib-upload-key.keystore
          MYAPP_UPLOAD_KEY_ALIAS=${KEY_ALIAS}
          MYAPP_UPLOAD_STORE_PASSWORD=${STORE_PASS}
          MYAPP_UPLOAD_KEY_PASSWORD=${KEY_PASS}
          EOF
          python3 - <<'PY'
          import re
          with open("android/app/build.gradle", "r") as f:
              g = f.read()
          release_signing = '''        release {
              if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                  storeFile file(MYAPP_UPLOAD_STORE_FILE)
                  storePassword MYAPP_UPLOAD_STORE_PASSWORD
                  keyAlias MYAPP_UPLOAD_KEY_ALIAS
                  keyPassword MYAPP_UPLOAD_KEY_PASSWORD
              }
          }'''
          if re.search(r'signingConfigs\s*\{', g):
              g = re.sub(r'(signingConfigs\s*\{)', r'\1\n' + release_signing, g, count=1)
          else:
              g = re.sub(r'(android\s*\{)', r'\1\n    signingConfigs {\n' + release_signing + '\n    }', g, count=1)
          g = re.sub(
              r'(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)signingConfig\s+signingConfigs\.debug',
              r'\1signingConfig signingConfigs.release',
              g,
              count=1
          )
          with open("android/app/build.gradle", "w") as f:
              f.write(g)
          PY
        working-directory: ${{ env.APP_DIR }}
      - name: Build Play Store AAB & Signed APK
        run: |
          chmod +x gradlew
          n=0
          until ./gradlew bundleRelease assembleRelease --no-daemon; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "Build failed after $n tries"; exit 1; fi
            echo "Retrying in 30s (try $((n+1)) of 3)..."; sleep 30
          done
        working-directory: ${{ env.APP_DIR }}/android
      - name: Publish Android (.aab, .apk & keystore) to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.1.0-store-${{ github.run_number }}"
          name: "iHR Store Release v1.1.0 #${{ github.run_number }} (IPA + AAB + APK)"
          body: "Unified Store Release (.ipa + .aab + .apk + keystore)"
          draft: false
          prerelease: false
          files: |
            ${{ env.APP_DIR }}/android/app/build/outputs/bundle/release/*.aab
            ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
            ${{ env.APP_DIR }}/android/app/mtib-upload-key.keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: Build iOS (IPA)
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'ios' || github.event.inputs.target == '' }}
    runs-on: ${{ github.event.inputs.macos_runner || 'macos-14' }}
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Locate project folder and set build number
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          P=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          [ -z "$P" ] && { echo "No package.json found in repo."; exit 1; }
          APP_DIR=$(dirname "$P")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          sed -i '' "s/\"versionCode\": [0-9]*/\"versionCode\": $BUILD_NUM/" "$APP_DIR/app.json"
          sed -i '' "s/\"buildNumber\": \"[0-9]*\"/\"buildNumber\": \"$BUILD_NUM\"/" "$APP_DIR/app.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packages
        run: npm install --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
        working-directory: ${{ env.APP_DIR }}
      - name: Install CocoaPods
        run: cd ios && pod install
        working-directory: ${{ env.APP_DIR }}
      - name: Build Unsigned IPA
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -archivePath "$PWD/build/iHR.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p "$PWD/build/Payload"
          cp -R "$PWD/build/iHR.xcarchive/Products/Applications/"*.app "$PWD/build/Payload/"
          cd "$PWD/build"
          zip -r "iHR-v1.1.0-unsigned.ipa" Payload
        working-directory: ${{ env.APP_DIR }}
      - name: Publish iOS (.ipa) to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.1.0-store-${{ github.run_number }}"
          name: "iHR Store Release v1.1.0 #${{ github.run_number }} (IPA + AAB + APK)"
          files: ${{ env.APP_DIR }}/ios/build/iHR-v1.1.0-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
